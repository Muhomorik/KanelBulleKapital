name: PR Checks

on:
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore backend/KanelBrief.sln

      - name: Build
        run: dotnet build backend/KanelBrief.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test backend/KanelBrief.sln --configuration Release --no-build --verbosity normal
