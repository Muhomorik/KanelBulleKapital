name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
  DOTNET_VERSION: 9.0.x

jobs:
  build-test-deploy:
    name: Build, Test & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore backend/KanelBrief.sln

      - name: Build
        run: dotnet build backend/KanelBrief.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test backend/KanelBrief.sln --configuration Release --no-build --verbosity normal

      - name: Publish Functions
        run: dotnet publish backend/KanelBrief.Functions/KanelBrief.Functions.csproj --configuration Release --output ./publish

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./publish
          publish-profile: ${{ secrets.AZURE_FUNCTION_PUBLISH_PROFILE }}
          sku: flexconsumption
          remote-build: false
